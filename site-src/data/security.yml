title: "Apache Fineract® Security Reports"
intro:
  - "This page lists all security vulnerabilities fixed in released versions of Apache Fineract®. Each vulnerability is reported via [the ASF process](http://www.apache.org/security/) and given a security impact rating."
  - "If you have identified a security issue, let us know immediately via email to security AT fineract.apache.org. And be sure to [secure your server](https://fineract.apache.org/docs/current/#_securing_fineract)!"
releases:
  - id: "fixed-in-apache-fineract-1.15.0"
    version: "1.15.0"
    entries:
      - id: "cve-2026-56287"
        cve_id: "CVE-2026-56287"
        url: "https://www.cve.org/CVERecord?id=CVE-2026-56287"
        title: "boolean sql injection in client search api leading to local file disclosure"
        description: "Boolean SQL Injection vulnerability in Apache Fineract's Client Search API leading to Local File Disclosure."
        report: "2025-12-26"
        fix: "2026-06-23"
        affects: "1.14.0 and earlier releases"
        thanks:
          - "Thank you Anirudh Anand and Aman Sapra for identifying and reporting the issue."
          - "Thank you Terence Monteiro and Ádám Sághy for fixing it."
      - id: "cve-2026-35152"
        cve_id: "CVE-2026-35152"
        url: "https://www.cve.org/CVERecord?id=CVE-2026-35152"
        title: "sql injection in runreports endpoint"
        description: "SQL Injection vulnerability in Apache Fineract's runreports endpoint."
        report: "2026-01-28"
        fix: "2026-06-11"
        affects: "1.14.0 and earlier releases"
        thanks:
          - "Thank you JD Security Shenyi Team, Geo Chen, and Quac Tran for identifying and reporting the issue."
          - "Thank you Terence Monteiro, Ádám Sághy and Aleksandar Vidakovic for fixing it."
      - id: "cve-2026-57821"
        cve_id: "CVE-2026-57821"
        url: "https://www.cve.org/CVERecord?id=CVE-2026-57821"
        title: "sql injection via subquery in orderby parameter of office list api"
        description: "SQL Injection vulnerability in Apache Fineract's Office List API via a bare subquery in the orderBy parameter, bypassing the ColumnValidator fix introduced for CVE-2024-32838."
        report: "2026-04-14"
        fix: "2026-06-27"
        affects: "1.14.0 and earlier releases"
        thanks:
          - "Thank you Venkatraman Kumar (r3dw0lfsec), Securin for identifying and reporting the issue."
          - "Thank you Terence Monteiro and Ádám Sághy for fixing it."
  - id: "fixed-in-apache-fineract-1.12.1"
    version: "1.12.1"
    entries:
      - id: "cve-2025-58137"
        cve_id: "CVE-2025-58137"
        url: "https://www.cve.org/CVERecord?id=CVE-2025-58137"
        title: "auth bypass through user-controlled key"
        description: "Authorization Bypass Through User-Controlled Key vulnerability in Apache Fineract®."
        report: "2024-10-07"
        fix: "2025-05-16"
        affects: "1.11.0 and earlier releases"
        thanks:
          - "Thank you Peter Chen with PayPal Security for identifying the issue."
          - "Thank you Ádám Sághy, Aleksandar Vidakovic, and Victor Romero for fixing it."
      - id: "cve-2025-58130"
        cve_id: "CVE-2025-58130"
        url: "https://www.cve.org/CVERecord?id=CVE-2025-58130"
        title: "insufficiently protected credentials"
        description: "Insufficiently Protected Credentials vulnerability in Apache Fineract®."
        report: "2024-10-07"
        fix: "2025-04-14"
        affects: "1.11.0 and earlier releases"
        thanks:
          - "Thank you Peter Chen with PayPal Security for identifying the issue."
          - "Thank you Jose Alberto Hernandez and Ádám Sághy for fixing it."
  - id: "fixed-in-apache-fineract-1.11.0"
    version: "1.11.0"
    entries:
      - id: "cve-2025-23408"
        cve_id: "CVE-2025-23408"
        url: "https://www.cve.org/CVERecord?id=CVE-2025-23408"
        title: "weak password policy"
        description: "Weak Password Requirements vulnerability in Apache Fineract®."
        report: "2024-10-07"
        fix: "2024-11-11"
        affects: "1.10.1 and earlier releases"
        thanks:
          - "Thank you Peter Chen with PayPal Security for identifying the issue."
          - "Thank you Kristof Jozsa with BaaSFlow for fixing it."
  - id: "fixed-in-apache-fineract-1.10.1"
    version: "1.10.1"
    entries:
      - id: "cve-2024-32838"
        cve_id: "CVE-2024-32838"
        url: "https://www.cve.org/CVERecord?id=CVE-2024-32838"
        title: "SQL injection - various"
        description: >-
          SQL Injection vulnerability in various API endpoints - offices, dashboards, etc.
          Apache Fineract® versions 1.9 and before have a vulnerability that allows an authenticated attacker to inject malicious
          data into some of the REST API endpoints' query parameter. Users are recommended to upgrade to version 1.10.1, which fixes this issue.
          A SQL Validator has been implemented which allows us to configure a series of tests and checks against our SQL queries
          that will allow us to validate and protect against nearly all potential SQL injection attacks.
        report: "2024-04-18"
        fix: "2024-05-01"
        affects: "1.9.0 and earlier releases"
        thanks:
          - "We acknowledge Kabilan S - Security engineer at Zoho, for identifying the issue and Aleksandar for resolving it."
  - id: "fixed-in-apache-fineract-1.9.0"
    version: "1.9.0"
    entries:
      - id: "cve-2024-23539"
        cve_id: "CVE-2024-23539"
        url: "https://www.cve.org/CVERecord?id=CVE-2024-23539"
        title: "vulnerable endpoints"
        description: "Under certain system configurations, the sqlSearch parameter for specific endpoints was vulnerable to SQL injection attacks, potentially allowing attackers to manipulate database queries."
        references:
          - "Fixed by <https://github.com/apache/fineract/pull/3621>."
        report: "2023-09-04"
        fix: "2023-12-06"
        affects: "1.8.4 and earlier releases"
        thanks:
          - "We thank Yash Sancheti of GH Solutions Consultants for reporting this issue."
      - id: "cve-2024-23538"
        cve_id: "CVE-2024-23538"
        url: "https://www.cve.org/CVERecord?id=CVE-2024-23538"
        title: "SQL injection - sqlSearch"
        description: "Under certain system configurations, the sqlSearch parameter was vulnerable to blind SQL injection attacks, potentially allowing attackers to manipulate database queries."
        references:
          - "Fixed by <https://github.com/apache/fineract/pull/3626>."
        report: "2023-08-09"
        fix: "2023-12-06"
        affects: "1.8.4 and earlier releases"
        thanks:
          - "We thank Majd Alasfar of ProgressSoft for reporting this issue."
      - id: "cve-2024-23537"
        cve_id: "CVE-2024-23537"
        url: "https://www.cve.org/CVERecord?id=CVE-2024-23537"
        title: "privilege escalation"
        description: "Under certain circumstances, this vulnerability allowed users, without specific permissions, to escalate their privileges to any role, including super user status. This flaw could enable users to gain control over user management."
        references:
          - "Fixed by <https://github.com/apache/fineract/pull/3626>."
        report: "2023-09-04"
        fix: "2023-12-06"
        affects: "1.8.4 and earlier releases"
        thanks:
          - "We thank Yash Sancheti of GH Solutions Consultants for reporting this issue."
  - id: "fixed-in-apache-fineract-1.8.4-and-1.7.3"
    version: "1.8.4 and 1.7.3"
    entries:
      - id: "cve-2023-25197"
        cve_id: "CVE-2023-25197"
        url: "https://www.cve.org/CVERecord?id=CVE-2023-25197"
        title: "SQL injection"
        description: "Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection') vulnerability in Apache Software Foundation apache fineract."
        report: ""
        fix: ""
        affects: "1.8.3 and earlier releases"
        thanks:
          - "We would like to thank Eugene Lim at Cyber Security Group (CSG) Government Technology Agency GOVTECH.sg, for reporting this issue, and the Apache Security team for their assistance. Thank you to Aleksandar Vidakovic for resolving this CVE."
      - id: "cve-2023-25196"
        cve_id: "CVE-2023-25196"
        url: "https://www.cve.org/CVERecord?id=CVE-2023-25196"
        title: "SQL injection"
        description: "Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection') vulnerability in Apache Software Foundation Apache Fineract®. Authorized users may be able to change or add data in certain components."
        report: "2022-12-02"
        fix: "2023-03-01"
        affects: "1.8.3 and earlier releases"
        thanks:
          - "We would like to thank Zhang Baocheng at Leng Jing Qi Cai Security Lab, for reporting this issue, and the Apache Security team for their assistance. Thank you to aleks@apache.org for resolving this CVE."
      - id: "cve-2023-25195"
        cve_id: "CVE-2023-25195"
        url: "https://www.cve.org/CVERecord?id=CVE-2023-25195"
        title: "SSRF"
        description: "Server-Side Request Forgery (SSRF) vulnerability in Apache Software Foundation Apache Fineract®. Authorized users with limited permissions can gain access to server and may be able to use server for any outbound traffic."
        report: "2022-12-06"
        fix: "2023-03-01"
        affects: "1.8.3 and earlier releases"
        thanks:
          - "We would like to thank Huydoppa from GHTK, for reporting this issue, and the Apache Security team for their assistance. Thank you to Aleks@apache.org for resolving this CVE."
  - id: "fixed-in-apache-fineract-1.8.1-and-1.7.1"
    version: "1.8.1 and 1.7.1"
    entries:
      - id: "cve-2022-44635"
        cve_id: "CVE-2022-44635"
        url: "https://www.cve.org/CVERecord?id=CVE-2022-44635"
        title: "file upload vulnerability"
        description: "Apache Fineract® allowed an authenticated user to perform remote code execution due to a path traversal vulnerability in a file upload component of Apache Fineract®, allowing an attacker to run remote code. This issue affects Apache Fineract® version 1.8.0 and prior versions. We recommend users to upgrade to 1.8.1."
        references:
          - "Under typical deployments, remote code could be run."
        report: "2022-10-31"
        fix: "2022-11-22"
        affects: "1.8.0 and earlier releases"
        thanks:
          - "We would like to thank Sapra co-captain of the Super Guesser CTF team & Security researcher at CRED, for reporting this issue, and the Apache Security team for their assistance. We give kudos and karma to Aleksandar Vidakovic for resolving this CVE."
  - id: "fixed-in-apache-fineract-1.5.0"
    version: "1.5.0"
    entries:
      - id: "cve-2020-17514"
        cve_id: "CVE-2020-17514"
        url: "https://www.cve.org/CVERecord?id=CVE-2020-17514"
        title: "disabled hostname verification for HTTPS"
        description: "Apache Fineract® disables HTTPS hostname verification in `ProcessorHelper` in the `configureClient` method."
        references:
          - "Under typical deployments, a man in the middle attack could be successful."
        report: "2020-10-15"
        fix: "2020-10-19"
        affects: "1.4.0 and earlier releases"
        thanks:
          - "We would like to thank [Simon Gerst](https://github.com/intrigus-lgtm) for reporting this issue, and the Apache Security team for their assistance."
  - id: "fixed-in-apache-fineract-1.4.0"
    version: "1.4.0"
    entries:
      - id: "cve-2018-20243"
        cve_id: "CVE-2018-20243"
        url: "https://www.cve.org/CVERecord?id=CVE-2018-20243"
        title: "unencrypted username and password in URL"
        description: "The implementation of POST with the username and password in the URL parameters exposed the credentials. More information is available in Fineract® JIRA issues 726 and 629."
        report: "2018-12-31"
        fix: "2020-01-01"
        affects: "1.3.0 and earlier releases"
        thanks:
          - "We would like to thank [Simon Gerst](https://github.com/intrigus-lgtm) for reporting this issue, and the Apache Security team for their assistance."
  - id: "fixed-in-apache-fineract-1.3.0"
    version: "1.3.0"
    entries:
      - id: "cve-2018-11801"
        cve_id: "CVE-2018-11801"
        url: "https://www.cve.org/CVERecord?id=CVE-2018-11801"
        title: "SQL Injection - m_center"
        description: "SQL injection vulnerability in Apache Fineract® before 1.3.0 allows attackers to execute arbitrary SQL commands via a query on a m_center data related table."
        report: "2018-08-29"
        fix: "2018-12-01"
        affects: "1.2.0 and earlier releases"
        thanks:
          - "We would like to thank Niels Heinen from Google for reporting this issue, and the Apache Security team for their assistance."
      - id: "cve-2018-11800"
        cve_id: "CVE-2018-11800"
        url: "https://www.cve.org/CVERecord?id=CVE-2018-11800"
        title: "SQL Injection - GroupSummaryCounts"
        description: "SQL injection vulnerability in Apache Fineract® before 1.3.0 allows attackers to execute arbitrary SQL commands via a query on the GroupSummaryCounts related table."
        report: "2018-08-29"
        fix: "2018-12-01"
        affects: "1.2.0 and earlier releases"
        thanks:
          - "We would like to thank Niels Heinen from Google for reporting this issue, and the Apache Security team for their assistance."
      - id: "cve-2016-4977"
        cve_id: "CVE-2016-4977"
        url: "https://www.cve.org/CVERecord?id=CVE-2016-4977"
        title: "RCE as a result of CVE in upstream dependency"
        description: "A known vulnerability in spring security upstream dependencies allowed malicious users to trigger remote code execution."
        report: "2018-12-17"
        fix: "2019-02-01"
        affects: "1.2.0 and earlier releases"
        thanks:
          - "We would like to thank Roberto (extranewbugs@gmail.com) for reporting this issue, and the Apache Security team for their assistance."
  - id: "fixed-in-apache-fineract-1.1.0"
    version: "1.1.0"
    entries:
      - id: "cve-2018-1292"
        cve_id: "CVE-2018-1292"
        url: "https://www.cve.org/CVERecord?id=CVE-2018-1292"
        title: "SQL Injection - reportName"
        description: "Within the 'getReportType' method, a hacker could inject SQL to read/update data for which he doesn't have authorization for by way of the 'reportName' parameter."
        report: "2018-01-23"
        fix: "2018-04-19"
        affects: "1.0.0 and earlier releases"
        thanks:
          - "We would like to thank 圆珠笔 (627963028@qq.com) and the Apache Security team for reporting this issue."
      - id: "cve-2018-1291"
        cve_id: "CVE-2018-1291"
        url: "https://www.cve.org/CVERecord?id=CVE-2018-1291"
        title: "SQL Injection - order"
        description: "Apache Fineract® exposes different REST end points to query domain specific entities with a Query Parameter 'orderBy' which are appended directly with SQL statements. A hacker/user can inject/draft the 'orderBy' query parameter by way of the \"order\" param in such a way to to read/update the data for which he doesn't have authorization."
        report: "2018-01-23"
        fix: "2018-04-19"
        affects: "1.0.0 and earlier releases"
        thanks:
          - "We would like to thank 圆珠笔 (627963028@qq.com) and the Apache Security team for reporting this issue."
      - id: "cve-2018-1290"
        cve_id: "CVE-2018-1290"
        url: "https://www.cve.org/CVERecord?id=CVE-2018-1290"
        title: "SQL Injection - single quotation escape"
        description: "Using a single quotation escape with two continuous SQL parameters can cause a SQL injection. This could be done in Methods like retrieveAuditEntries of AuditsApiResource Class retrieveCommands of MakercheckersApiResource Class."
        report: "2018-01-23"
        fix: "2018-04-19"
        affects: "1.0.0 and earlier releases"
        thanks:
          - "We would like to thank 圆珠笔 (627963028@qq.com) and the Apache Security team for reporting this issue."
      - id: "cve-2018-1289"
        cve_id: "CVE-2018-1289"
        url: "https://www.cve.org/CVERecord?id=CVE-2018-1289"
        title: "SQL Injection - orderBy and sortOrder"
        description: "Apache Fineract® exposes different REST end points to query domain specific entities with a Query Parameter 'orderBy' and 'sortOrder' which are appended directly with SQL statements. A hacker/user can inject/draft the 'orderBy' and 'sortOrder' query parameter in such a way to read/update the data for which he doesn't have authorization."
        report: "2018-01-18"
        fix: "2018-04-19"
        affects: "1.0.0 and earlier releases"
        thanks:
          - "We would like to thank 圆珠笔 (627963028@qq.com) and the Apache Security team for reporting this issue."
  - id: "fixed-in-apache-fineract-1.0.0"
    version: "1.0.0"
    entries:
      - id: "cve-2017-5663"
        cve_id: "CVE-2017-5663"
        url: "https://www.cve.org/CVERecord?id=CVE-2017-5663"
        title: "SQL Injection - sqlSearch"
        description: "An authenticated user with client/loan/center/staff/group read permissions is able to inject malicious SQL into SELECT queries. The 'sqlSearch' parameter on a number of endpoints is not sanitized and appended directly to the query. List of vulnerable endpoints: /staff, /clients, /loans, /centers, /groups."
        report: "2017-04-02"
        fix: "2017-12-13"
        affects: "0.6.0-incubating and earlier releases"
        thanks:
          - "We would like to thank Alex Ivanov and the Apache Security team for reporting this issue."
policy_updates:
  id: "notable-fineract-security-policy-updates"
  title: "Notable security policy updates"
  items:
    - "January 15, 2025: The project now determines on a case by case basis whether a CVE fix will be back-ported to any prior release. The default is that all prior releases are immediately determined as EOL (end of life) when a new release happens."
    - "November 29, 2022: In order to ensure that users are given warning of critical issues, the Apache Fineract® project may use its relationship with the independent Mifos Initiative to ensure that users of the Fineract® backend and Mifos front end UI are informed of such vulnerabilities and are able to assist in testing and validating patches."
editing:
  id: "editing-this-document"
  title: "Editing this document"
  notes:
    - "The source data for this page is `site-src/data/security.yml`. The page is rendered as `security.html` by Hugo."
    - "Keep entries simple and consistent."
    - "If you change the structure for one CVE entry, do so throughout the document."
    - "Major headings are releases in descending order (most recent first). Minor headings are CVE IDs, also in descending order. Always use `www.cve.org` for canonical CVE links. Date format for report/fix fields is YYYY-MM-DD."
