homepage:
  page_heading: "Apache Fineract®"
  platform:
    title: "Platform for Digital Financial Services"
    intro:
      icon: "account_balance"
      title: "What is Apache Fineract®?"
      text: "Apache Fineract® (\\'fīn-,ə-,rakt\\) is open source software for financial services, designed to create a cloud-ready core banking system that enables digital financial services for everyone, including the unbanked and underbanked."
    mission:
      icon: "rocket_launch"
      title: "Our Mission"
      items:
        - icon: "cloud_done"
          text: "Build and maintain a cloud-ready core banking system"
        - icon: "security"
          text: "Ensure robust, scalable, and secure operations"
        - icon: "accessibility_new"
          text: "Promote financial inclusion worldwide"
        - icon: "savings"
          text: "Enable digital transaction accounts for all"
    benefits:
      icon: "stars"
      title: "Key Benefits"
      items:
        - icon: "verified"
          title: "Reliable"
          text: "Proven track record in high-transaction environments"
        - icon: "trending_up"
          title: "Scalable"
          text: "Designed for cloud deployment and growth"
        - icon: "savings"
          title: "Affordable"
          text: "Cost-effective solution for institutions of all sizes"
        - icon: "api"
          title: "Open APIs"
          text: "Headless application design for maximum flexibility"
    solution_providers:
      title: "For Solution Providers"
      intro: "Fineract® 1.x is a cloud-ready platform with open APIs, designed as a headless application.<br>This makes it ideal for solution providers who want to:"
      cards:
        - icon: "integration_instructions"
          title: "Integrate"
          text: "Build custom interfaces and extensions"
        - icon: "architecture"
          title: "Scale"
          text: "Deploy cloud-native solutions"
        - icon: "hub"
          title: "Innovate"
          text: "Create unique financial products"

  about:
    id: "about"
    title: "About"
    intro:
      icon: "info"
      title: "What is Fineract®?"
      text: "Apache Fineract® is a sophisticated core banking system that provides comprehensive financial technology solutions. It offers robust features for client data management, loan and savings portfolio management, integrated real-time accounting, and extensive reporting capabilities."
    columns:
      - icon: "settings"
        title: "Key Features"
        items:
          - icon: "tune"
            title: "Flexible Product Configuration"
            text: "Customize financial products to meet your needs"
          - icon: "verified_user"
            title: "KYC Documentation Support"
            text: "Flexible customer system of record"
          - icon: "rule"
            title: "Business Rule Sets"
            text: "Four eyes principles and configurable workflows"
          - icon: "payments"
            title: "Payment Recognitions"
            text: "System of record for repayments"
          - icon: "account_balance"
            title: "Portfolio Management"
            text: "Complete loan and investment tracking"
      - icon: "architecture"
        title: "Deployment Options"
        items:
          - icon: "cloud"
            title: "Cloud Deployment"
            text: "Scalable cloud-based solutions with active community support"
          - icon: "computer"
            title: "On-Premise"
            text: "Legacy or Traditional deployment"
          - icon: "phone_iphone"
            title: "Mobile Access via Headless Design"
            text: "Headless designs allow for third party mobile solutions"
          - icon: "api"
            title: "Open API"
            text: "Comprehensive API support since 2011"
          - icon: "extension"
            title: "Extensible Architecture"
            text: "Support for any organizational type or delivery channel"
    notices:
      - panel_class: "yellow lighten-4"
        icon: "warning"
        title: "Important Notice"
        intro: "We encourage all users of Fineract® to:"
        items:
          - "Consult competent technical resources for questions about secure deployment and operation"
          - "Review the <a href=\"https://cwiki.apache.org/confluence/pages/viewpage.action?pageId=91554327\">FAQ</a> and <a href=\"https://fineract.apache.org/docs/current/#_securing_fineract\">Security Guide</a> for essential setup information"
          - "Refer to the Apache license for legal information"
      - panel_class: "red lighten-5"
        icon: "history"
        title: "Deprecated Sub-Project Notice"
        text: "The Fineract® CN project (microservice architecture version) was deprecated in May 2023 and archived in late 2023. While this side-project served an important role in describing a microservice approach, it was never officially released."

  contribute:
    id: "contribute"
    title: "Contribute"
    intro_card:
      icon: "people"
      title: "Join Our Community"
    ways:
      icon: "build"
      title: "Ways to Contribute"
      items:
        - icon: "code"
          text: "Submit bug fixes and new features to the codebase"
        - icon: "description"
          text: "Improve documentation and wiki pages"
        - icon: "web"
          text: "Enhance the website user experience"
        - icon: "school"
          text: "Help users learn best practices"
        - icon: "bug_report"
          text: "Report bugs and suggest improvements"
    mailing_lists:
      icon: "mail"
      title: "Mailing Lists"
      subscribe_label: "Subscribe"
      archives_label: "Archives"
      entries:
        - title: "Development List"
          description: "For users, developers, and contributors discussing Apache Fineract®"
          email: "dev@fineract.apache.org"
          subscribe: "mailto:dev-subscribe@fineract.apache.org"
          archives: "https://lists.apache.org/list.html?dev@fineract.apache.org"
        - title: "Commits List"
          description: "Receive notifications of all code contributions"
          email: "commits@fineract.apache.org"
          subscribe: "mailto:commits-subscribe@fineract.apache.org"
          archives: "https://lists.apache.org/list.html?commits@fineract.apache.org"
        - title: "Issues List"
          description: "Receive notifications of all issue tracker activity"
          email: "issues@fineract.apache.org"
          subscribe: "mailto:issues-subscribe@fineract.apache.org"
          archives: "https://lists.apache.org/list.html?issues@fineract.apache.org"
    getting_started:
      panel_class: "yellow lighten-4"
      icon: "tips_and_updates"
      title: "Getting Started"
      intro: "New to contributing? Check out our <a href=\"https://cwiki.apache.org/confluence/display/FINERACT/Contributor%27s+Zone\">Contributor's Guide</a> for:"
      columns:
        -
          - "Development environment setup"
          - "Coding standards and best practices"
          - "Pull request guidelines"
        -
          - "Testing procedures"
          - "Documentation guidelines"
          - "Community best practices"

  downloads:
    id: "downloads"
    title: "Downloads"
    intro: "Below you'll find official Apache Fineract® releases. We recommend using the latest stable version. Each release includes binary and source distributions with corresponding verification files."
    releases:
      - version: "1.14.0"
        status: "current stable"
      - version: "1.13.0"
        status: "EOL"
      - version: "1.12.1"
        status: "EOL"
    verification:
      icon: "verified_user"
      title: "Verifying Downloads"
      intro: "We recommend verifying downloaded files using:"
      methods:
        - icon: "security"
          title: "GPG Signature (.asc)"
          description: "PGP signature files (verify with <a href=\"https://downloads.apache.org/fineract/KEYS\">KEYS</a>)"
        - icon: "check_circle"
          title: "SHA512"
          description: "Checksums to verify file integrity"
      guide:
        prefix: "See"
        href: "https://www.apache.org/info/verification.html"
        label: "Verifying Apache Software Foundation Releases"
        icon: "launch"
    archive_note: "If you are looking for an old release that is not present here or on the mirror, please check the <a href=\"https://archive.apache.org/dist/fineract/\">Apache archives</a>."

  resources:
    id: "resources"
    title: "Resources"
    rows:
      - cards:
          - icon: "rocket_launch"
            title: "Getting Started"
            links:
              - title: "Demo Server"
                text: "Try Fineract® on our community CI/CD server"
                href: "https://www.fineract.dev/"
              - title: "Getting Started Guide"
                text: "Setup guide for Fineract® 1.x (non-CN)"
                href: "https://cwiki.apache.org/confluence/display/FINERACT/Getting+Started+Docs"
              - title: "Contributor's Guide"
                text: "Learn how to contribute to Fineract®"
                href: "https://cwiki.apache.org/confluence/display/FINERACT/Contributor%27s+Zone"
          - icon: "engineering"
            title: "Development"
            links:
              - title: "Main Repository"
                text: "Source code for Apache Fineract®"
                href: "https://github.com/apache/fineract"
              - title: "Issue Tracker"
                text: "Report bugs and request features"
                href: "https://issues.apache.org/jira/projects/FINERACT"
              - title: "Committer's Zone"
                text: "Guidelines for pull requests and code reviews"
                href: "https://cwiki.apache.org/confluence/display/FINERACT/Committer%27s+Zone"
      - cards:
          - icon: "description"
            title: "Documentation"
            links:
              - title: "Project Wiki"
                text: "Project management and legacy documentation"
                href: "https://cwiki.apache.org/confluence/display/FINERACT/Fineract+Home"
              - title: "Current Documentation"
                text: "System documentation"
                href: "https://fineract.apache.org/docs/current/"
              - title: "API Documentation"
                text: "Legacy API reference"
                href: "https://fineract.apache.org/docs/legacy/"
              - title: "Security Reports"
                text: "Fixed security issues and updates"
                href: "security.html"
          - icon: "code"
            title: "Related Resources"
            links:
              - title: "Website Repository"
                text: "Source code for this website"
                href: "https://github.com/apache/fineract-site"
              - title: "Licensing"
                text: "Apache License information"
                href: "https://www.apache.org/licenses/"
              - title: "Security"
                text: "Apache security policies and procedures"
                href: "https://www.apache.org/security/"
              - title: "FAQ"
                text: "Apache security policies and procedures"
                href: "https://cwiki.apache.org/confluence/pages/viewpage.action?pageId=91554327"

